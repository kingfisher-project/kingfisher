name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docs preset doesn't compile Kingfisher, so MFEM is never fetched
      # here. The build and tests run in ci.yml.
      # The same conda environment as for local builds; see docs/environment.yml.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: docs/environment.yml
          cache-environment: true

      # A login shell is needed for the environment to be active.
      - name: Build docs
        shell: bash -el {0}
        run: cmake --workflow --preset docs

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/docs/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
