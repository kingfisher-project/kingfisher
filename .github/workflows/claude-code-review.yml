name: Claude Code Review

# Reviews every pull request once, when it is opened or marked ready for
# review, using the reviewing-kingfisher-code skill. To review again after new
# commits, comment "@claude review" on the PR (see claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Read CLAUDE.md, AGENTS.md, and
            .claude/skills/reviewing-kingfisher-code/SKILL.md, then review this
            pull request by following that skill. Use `gh pr diff` and
            `gh pr view` to get the changes; the repository is checked out at
            the PR head for reading surrounding code.

            Post the full structured report from the skill as a single PR
            comment with `gh pr comment`. For findings tied to specific lines,
            also leave inline comments with
            mcp__github_inline_comment__create_inline_comment.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
