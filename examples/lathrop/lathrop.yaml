---
# Example: 2D Monoenergetic Lathrop Problem, as described in "Remedies for Ray Effects" by K. D. Lathrop.
# Note that this model uses quarter symmetry with reflective boundary conditions.

problem:
  name: lathrop
  mode: fixed_source

mesh:
  filename: lathrop.msh

boundary_conditions:
  - name: outer_wall
    type: "vacuum"
  - name: "reflective_wall"
    type: "reflective"

materials:
  - name: lathrop_material
    total_xs: [0.75] # braces for group structure
    scatter_xs: [[0.5]] # braces for group structure

sources:
  - name: square_source
    type: volumetric
    # problem specifies a flat, isotropic source
    expression: ["1.0/4.0/pi"] # braces for group structure

angular:
  type: discrete_ordinates
  polar_quad_set: { type: gauss_legendre, n_directions: 4 }
  azimuthal_quad_set: { type: trapezoid, n_directions: 4 }

spatial:
  node_placement: gauss_lobatto_legendre
  nodes_per_axis: 3

solver:
  source_iterations:
    tolerance: 1e-8
    max_iterations: 50

output:
  format: vtkhdf
  export_values: [scalar_flux, angular_flux]
...
